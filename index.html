<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆弾解除ページ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. スタート画面 -->
    <div id="start-screen" class="container">
        <h1>爆弾解除ミッション</h1>
        <p>制限時間は3分間です。</p>
        <button id="start-btn">スタート</button>
    </div>

    <!-- 2. メイン画面（初期状態では非表示） -->
    <div id="main-screen" class="container" style="display: none;">
        <!-- タイマー表示 -->
        <div id="timer">03:00</div>

        <div>
            <img class="question-picture" src="question.png" alt="問題の写真">
        </div>

        <div class="image-container">
            <img class="doc-picture" src="doc.png" alt="博士の写真">
            <a href="#" class="white-btn"></a>
        </div>

        <div class="buttons">
            <button type="button" class="red btn"></button>
            <button type="button" class="blue btn"></button>
            <button type="button" class="green btn"></button>
        </div>
    </div>

    <!-- 3. 結果画面（初期状態では非表示） -->
    <div id="result-screen" class="container" style="display: none;">
        <img id="result-image" src="" alt="結果">
    </div>

    <script src="script.js"></script>
</body>
</html>
